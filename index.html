    <meta name="theme-color" content="#000000" />
    <script>
      // the stored theme is applied before first paint, so there is no flash
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('theme') || 'amoled'
      } catch {
        /* storage unavailable — amoled stands */
      }
    </script>

    <script
      data-goatcounter="https://prawal.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
