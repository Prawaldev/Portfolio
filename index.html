<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      // the stored theme is applied before first paint, so there is no flash
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('theme') || 'amoled'
      } catch {
        /* storage unavailable — amoled stands */
      }
    </script>
    <meta
      name="description"
      content="Prawal Khadka — web developer and anime enthusiast. Explore my projects, favourite anime, manga and movies, and get in touch."
    />
    <meta name="author" content="Prawal Khadka" />
    <link rel="canonical" href="https://prawal.pages.dev/" />

    <!-- link previews: Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prawaldev" />
    <meta property="og:url" content="https://prawal.pages.dev/" />
    <meta property="og:title" content="Prawal Khadka(Prawaldev)" />
    <meta
      property="og:description"
      content="Prawal Khadka(Prawaldev)web developer and anime enthusiast. Explore my projects, favourite anime, manga and movies, and get in touch."
    />
    <meta property="og:image" content="https://prawal.pages.dev/og-image.png" />
    <meta property="og:image:secure_url" content="https://prawal.pages.dev/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Prawal Khadka's avatar — an ink drawing of a long-haired swordsman — with his name and role on a black background."
    />
    <meta property="og:locale" content="en_US" />

    <!-- link previews: X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prawaldev — Prawal Khadka" />
    <meta
      name="twitter:description"
      content="Prawal Khadka(Prawaldev)web developer and anime enthusiast. Explore my projects, favourite anime, manga and movies, and get in touch."
    />
    <meta name="twitter:image" content="https://prawal.pages.dev/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Prawal Khadka's avatar — an ink drawing of a long-haired swordsman — with his name and role on a black background."
    />

    <title>Prawaldev</title>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/BrassMonoCode-Regular.ttf" as="font" type="font/ttf" crossorigin />

    <script
      data-goatcounter="https://prawal.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
